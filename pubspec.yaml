name: fair_share_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.6.1
  provider: ^6.1.5+1
  cloud_firestore: ^6.9.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/fairshare_icon.png"

flutter_native_splash:
  color: "#F4F8F7"
  image: assets/images/fairshare_icon.png 
  android_12:
    image: assets/images/fairshare_icon.png
    icon_background_color: "#F4F8F7"

flutter:
  uses-material-design: true

  assets:
    - assets/images/fairshare_icon.png